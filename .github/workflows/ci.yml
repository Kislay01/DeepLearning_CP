name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"  # weekly dependency audit (security.md §7)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.11"
  CAPTIONER_DEVICE: cpu
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration" --cov=captioner --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: No pickle / unsafe torch.load
        run: python3 scripts/check_no_pickle.py src app
      - name: pip-audit (locked dependencies)
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt > /tmp/requirements.lock
          uvx pip-audit --disable-pip --require-hashes -r /tmp/requirements.lock $(cat .pip-audit-ignore 2>/dev/null | grep -v '^#' | sed 's/^/--ignore-vuln /')
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    # Builds the CPU serving image and checks that the app starts (architecture.md §10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t captioner:ci .
      - name: Smoke test (non-root, health endpoint)
        run: |
          test "$(docker run --rm captioner:ci id -u)" = "10001"
          docker run --rm captioner:ci captioner version
          docker run --rm --network none captioner:ci python -c "from captioner.tts.speak import synthesize; s = synthesize('A dog runs.', engine='piper'); assert s.audio[:4] == b'RIFF'; print('local speech ok', len(s.audio))"
          docker run -d --name app -p 8501:8501 --read-only --tmpfs /tmp \
            -v captioner-cache:/home/app/.cache captioner:ci
          for i in $(seq 1 30); do curl -fsS localhost:8501/_stcore/health && break; sleep 2; done
          curl -fsS localhost:8501/_stcore/health
          docker logs app | tail -20
