[project]
name = "captioner"
version = "0.1.0"
description = "Image caption generator (ResNet-50 encoder + LSTM decoder with soft attention) with speech output"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Kislay Upadhyay" }]
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19",
    "numpy>=1.26,<3",
    "pillow>=10.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "h5py>=3.11",
    "pydantic>=2.8",
    "pyyaml>=6.0.2",
    "typer>=0.12",
    "rich>=13.7",
    "mlflow-skinny>=2.16",
    "tensorboard>=2.17",
    "nltk>=3.9",
    "pycocoevalcap>=1.2",
    "gtts>=2.5",
    "streamlit>=1.39",
    "safetensors>=0.4.5",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
offline-tts = ["pyttsx3>=2.98"]

[project.scripts]
captioner = "captioner.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "nbstripout>=0.8",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captioner"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH", "RUF", "NPY", "PD"]
ignore = [
    "N812",  # `import torch.nn.functional as F` is the PyTorch convention
    "RUF001", "RUF002", "RUF003",  # Greek letters / math symbols in model docstrings are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "h5py.*",
    "torchvision.*",
    "pycocoevalcap.*",
    "nltk.*",
    "gtts.*",
    "pyttsx3.*",
    "mlflow.*",
    "safetensors.*",
    "matplotlib.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests on the mini fixture set (slower)",
    "benchmark: latency benchmarks",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
]

[tool.coverage.run]
source = ["captioner"]
omit = [
    "*/captioner/cli.py",
    "*/captioner/training/train.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise AssertionError"]
